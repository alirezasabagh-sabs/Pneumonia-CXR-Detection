# ============================================================
# Radiology-AI-Pneumonia-PatchMIL — Public Config
# ============================================================
project:
  name: "Radiology-AI-Pneumonia-PatchMIL"
  seed: 42

paths:
  root: "."
  data_root: "./data"
  processed_root: "./data_processed"
  patch_cache_root: "./patch_cache"
  weights_dir: "./weights"
  patch_mil_checkpoint_dir: "./weights/patch_mil"
  logs_dir: "./logs"
  external_test_root: "./external_test"

# Raw RSNA source paths are intentionally absent from the public config.
# If you need a private conversion pipeline, keep those paths in a local
# config file ignored by Git.

data:
  splits: ["train", "val", "test"]
  classes: ["NORMAL", "PNEUMONIA"]
  image_extensions: [".jpg", ".jpeg", ".png"]
  image_size: 224
  batch_size: 16
  num_workers: 4
  balance_domains: false

segmentation:
  backbone: "resnet34"
  crop_mode: "full_with_mask_prior"
  bbox_margin_ratio: 0.15
  mask_binary_threshold: 0.9
  clean_mask: true
  use_convex_hull: false
  mask_prior_type: "distance"
  mask_feather_px: 15
  mask_size: 512

patch_mil:
  canvas_size: 384
  use_multiscale: false
  scales:
    - patch_size: 48
      stride: 24
      coverage_threshold: 0.3
    - patch_size: 96
      stride: 48
      coverage_threshold: 0.3
  multiscale_output_size: 64
  max_patches_per_scale: 25

  patch_size: 64
  stride: 32
  coverage_threshold: 0.3
  max_patches: 100

  attention_pooling_hidden: 128
  head_dims: [256, 128, 1]
  dropout: 0.3

  pretrained_encoder: true
  freeze_encoder_epochs: 2
  partial_unfreeze_last_n_blocks: 1

  encoder_type: "torchxrayvision"
  txrv_input_size: 128
  # Soft lung-depth guidance for attention; does not remove pixels.
  mask_prior_type: "distance"
  mask_strength: 2.0
  hard_filter_threshold: 0.3

  context_layers: 2
  context_heads: 8

  contiguity_lambda: 0.0
  entropy_lambda: 0.002
  entropy_lambda_warmup_epochs: 8

  # Optional cached-training supervision from RSNA bounding boxes.
  instance_aux_lambda: 0.3
  rsna_bbox_labels_csv: null
  bbox_lambda: 0.2
  bbox_pos_weight: 5.0

  eval_every_n_epochs: 3

loss:
  type: "asymmetric_focal"
  gamma_pos: 1.0
  gamma_neg: 4.0
  clip: 0.05
  label_smoothing: 0.05
  eps: 1.0e-8

training:
  epochs: 30
  lr_head: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  early_stopping_patience: 6
  early_stopping_metric: "val_auc"
  target_sensitivity: 0.98
  mixed_precision: true
  grad_clip_norm: 1.0

device: "cuda"
